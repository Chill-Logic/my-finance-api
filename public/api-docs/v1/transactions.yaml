openapi: "3.0.3"

info:
  title: My Finance API — Transactions
  version: "1.0.0"
  description: |
    API REST do My Finance.
    ## Autenticação
    X-API-Key: <token> + Authorization: Bearer <token>

servers:
  - url: /v1
    description: Backend atual (mesma origem desta documentação)

tags:
  - name: Transactions
    description: Transações de uma carteira — depósitos e saques, valores em centavos

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
          example: "Salário"
        value:
          type: integer
          description: Valor em centavos
          example: 500000
        kind:
          type: string
          enum: [deposit, withdraw]
        translated_kind:
          type: string
          description: Label traduzido do enum `kind`
          example: "Depósito"
        transaction_date:
          type: string
          format: date-time
          description: Data nominal/vencimento da transação (quando ela deveria acontecer)
        settled_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Efetivado em (recebido/pago). Nulo = pendente. É o que define o mês em que a
            transação aparece na listagem; enquanto pendente, usa-se o transaction_date.
        draft:
          type: boolean
          description: Rascunho — quando true, é ignorada de todos os totais
        source_type:
          type: string
          enum: [Account, CreditBalance]
          description: Tipo da origem polimórfica
        source_id:
          type: string
          format: uuid
          description: ID da conta ou saldo de crédito de origem
        credit_card_id:
          type: string
          format: uuid
          nullable: true
          description: Cartão do saldo de crédito (só quando a origem é um CreditBalance)
        paid_credit_balance_id:
          type: string
          format: uuid
          nullable: true
          description: Preenchido quando o saque é o pagamento da fatura desse saldo de crédito
        wallet_id:
          type: string
          format: uuid
          description: Derivado automaticamente da origem
        user_id:
          type: string
          format: uuid
        user_name:
          type: string
          description: Nome do usuário que registrou a transação
          example: "Gabriel"
        discarded_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TransactionGroup:
      type: object
      description: Visão de uma origem (Conta ou Cartões) — lista e totais próprios
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        total_count:
          type: integer
          description: Quantidade de transações do grupo no mês
        total_settled:
          type: integer
          description: Saldo efetivado do grupo em centavos (só transações com settled_at)
        total_projected:
          type: integer
          description: Saldo previsto do grupo em centavos (efetivadas + pendentes)

    TransactionInput:
      type: object
      required: [transaction]
      properties:
        transaction:
          type: object
          properties:
            description:
              type: string
              example: "Mercado"
            value:
              type: integer
              description: Valor em centavos
              example: 35000
            kind:
              type: string
              enum: [deposit, withdraw]
            transaction_date:
              type: string
              format: date-time
              description: Aceita data simples (ex - "2026-07-06"), interpretada como meia-noite no fuso da aplicação (Brasília)
            source_type:
              type: string
              enum: [Account, CreditBalance]
              description: Obrigatório no create — tipo da origem
            source_id:
              type: string
              format: uuid
              description: Obrigatório no create — ID da conta/saldo de crédito. A carteira é derivada dele.
            credit_card_id:
              type: string
              format: uuid
              description: Opcional — cartão do saldo de crédito (deve pertencer ao CreditBalance de origem)
            draft:
              type: boolean
              description: Marca a transação como rascunho (ignorada dos totais)

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: "Mensagem de erro"

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: "Operação realizada com sucesso!"

security:
  - bearerAuth: []
    apiKeyAuth: []

paths:

  /transactions:
    get:
      tags: [Transactions]
      summary: Listar transações do mês de uma carteira (Conta e Cartões)
      description: >
        Retorna as transações do mês de referência divididas em duas visões: `accounts` (origem
        `Account`) e `credits` (origem `CreditBalance`). Cada visão traz sua própria lista `data`
        (ordenada por data decrescente) e seus totais `total_settled` (só efetivadas) e
        `total_projected` (efetivadas + pendentes) — ambos ignoram rascunhos (`draft`). Separar as
        visões evita a dupla contagem do cartão (o pagamento da fatura conta só em `accounts` e as
        compras só em `credits`). O mês vem de `month`+`year` ou de `reference` ("YYYY-MM"); sem
        parâmetros, usa o mês atual (fuso de Brasília). As duas visões usam janelas diferentes: em
        `accounts` o bucket é o mês-calendário, seguindo o `settled_at` quando a transação já foi
        efetivada (aparece no mês em que foi paga/recebida) e o `transaction_date` (vencimento)
        enquanto pendente; em `credits` o bucket é o **ciclo da fatura** de cada saldo de crédito
        (de um fechamento ao próximo, por `transaction_date`), então cada cartão respeita seu próprio
        dia de fechamento. A janela do ciclo depende de `due_day` vs `closing_day`: quando
        `due_day < closing_day` (fatura vence no mês seguinte ao fechamento) o ciclo do mês M fecha no
        próprio M (`[fechamento(M-1)+1 .. fechamento(M)]`); caso contrário fecha no mês seguinte
        (`[fechamento(M)+1 .. fechamento(M+1)]`). É o mesmo ciclo usado por
        `GET /credit_balances/{id}/invoice`. Rascunhos aparecem na lista, mas ficam fora dos totais.
      parameters:
        - name: wallet_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: month
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
          example: 7
        - name: year
          in: query
          required: false
          schema:
            type: integer
          example: 2026
        - name: reference
          in: query
          required: false
          schema:
            type: string
          example: "2026-07"
          description: Mês de referência no formato YYYY-MM (alternativa a month/year)
        - name: source_type
          in: query
          required: false
          schema:
            type: string
            enum: [Account, CreditBalance]
          description: Filtra por origem (junto com source_id)
        - name: source_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: terms
          in: query
          required: false
          schema:
            type: string
          description: Busca textual por descrição (insensível a acentos)
      responses:
        "200":
          description: Transações do mês (sem paginação) separadas em Conta e Cartões, cada uma com seus totais
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    $ref: "#/components/schemas/TransactionGroup"
                  credits:
                    $ref: "#/components/schemas/TransactionGroup"
        "422":
          description: Carteira não encontrada (não enviada, inexistente ou sem acesso)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Transactions]
      summary: Criar transação
      description: Cria uma transação numa origem (`source_type`/`source_id`, uma conta ou saldo de crédito), vinculada ao usuário autenticado. A carteira é derivada da origem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
            example:
              transaction:
                description: "Aluguel"
                value: 150000
                kind: withdraw
                transaction_date: "2026-07-06"
                source_type: Account
                source_id: "00000000-0000-0000-0000-000000000000"
      responses:
        "201":
          description: Transação criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Transaction"
        "422":
          description: Origem não encontrada ou dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions/{id}:
    get:
      tags: [Transactions]
      summary: Obter transação
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dados da transação
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Transaction"
        "422":
          description: Transação não encontrada (inexistente ou de carteira sem acesso)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Transactions]
      summary: Atualizar transação
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "200":
          description: Transação atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Transaction"
        "422":
          description: Transação não encontrada ou dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Transactions]
      summary: Remover transação (soft delete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transação removida com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "422":
          description: Transação não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions/{id}/settle:
    post:
      tags: [Transactions]
      summary: Efetivar transação
      description: Marca a transação como efetivada ("efetivado em"). Aceita `settled_at` opcional; sem ele, usa o instante atual.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                settled_at:
                  type: string
                  format: date-time
                  description: Data/hora da efetivação (default - agora)
      responses:
        "200":
          description: Transação efetivada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Transaction"
        "422":
          description: Transação não encontrada ou dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions/{id}/unsettle:
    post:
      tags: [Transactions]
      summary: Desfazer efetivação
      description: Volta a transação para pendente (limpa `settled_at`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Efetivação desfeita
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Transaction"
        "422":
          description: Transação não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
